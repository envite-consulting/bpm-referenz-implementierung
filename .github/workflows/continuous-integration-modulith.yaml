name: Business Logic Modulith - Continuous Integration

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/business-logic-modulith/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/business-logic-modulith/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'
      - name: Build Business Logic Modulith
        working-directory: ./backend/business-logic-modulith/
        run: ./mvnw clean verify
      - name: Upload ArchUnit report
        uses: actions/upload-artifact@v4
        with:
          name: archunit-report
          path: backend/business-logic-modulith/app/target/component-metrics.html
      - name: Post summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('backend/business-logic-modulith/app/target/component-metrics.html', 'utf8');
            const regex = /\<title\>([\s\S]*?)\<\/style\>/gi;
            core.summary.addHeading('ArchUnit Metrics Report')
              .addRaw(report.replaceAll(regex, ''))
              .write();
